apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai
  namespace: soranix
  labels:
    app: ai
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai
      tier: backend
  template:
    metadata:
      labels:
        app: ai
        tier: backend
    spec:
      serviceAccountName: soranix-sa
      containers:
        - name: ai
          image: soranix/ai:latest
          ports:
            - containerPort: 5001
              name: http
          resources:
            requests:
              cpu: '500m'
              memory: '1Gi'
            limits:
              cpu: '2000m'
              memory: '4Gi'
          livenessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 30
            periodSeconds: 10
          env:
            - name: NODE_ENV
              value: 'production'
            - name: PORT
              value: '5001'
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: soranix-secrets
                  key: openai-api-key





