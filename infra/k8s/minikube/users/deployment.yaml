apiVersion: apps/v1
kind: Deployment
metadata:
  name: users
  namespace: soranix
  labels:
    app: users
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: users
      tier: backend
  template:
    metadata:
      labels:
        app: users
        tier: backend
    spec:
      serviceAccountName: soranix-sa
      containers:
        - name: users
          image: soranix/users:latest
          ports:
            - containerPort: 5004
              name: http
          resources:
            requests:
              cpu: '200m'
              memory: '256Mi'
            limits:
              cpu: '1000m'
              memory: '1Gi'
          livenessProbe:
            httpGet:
              path: /health
              port: 5004
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 5004
            initialDelaySeconds: 5
            periodSeconds: 5
          env:
            - name: NODE_ENV
              value: 'production'
            - name: PORT
              value: '5004'





