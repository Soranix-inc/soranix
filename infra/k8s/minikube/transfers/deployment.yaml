apiVersion: apps/v1
kind: Deployment
metadata:
  name: transfers
  namespace: soranix
  labels:
    app: transfers
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: transfers
      tier: backend
  template:
    metadata:
      labels:
        app: transfers
        tier: backend
    spec:
      serviceAccountName: soranix-sa
      containers:
        - name: transfers
          image: soranix/transfers:latest
          ports:
            - containerPort: 5006
              name: http
          resources:
            requests:
              cpu: '200m'
              memory: '256Mi'
            limits:
              cpu: '1000m'
              memory: '1Gi'
          livenessProbe:
            httpGet:
              path: /health
              port: 5006
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 5006
            initialDelaySeconds: 5
            periodSeconds: 5
          env:
            - name: NODE_ENV
              value: 'production'
            - name: PORT
              value: '5006'





