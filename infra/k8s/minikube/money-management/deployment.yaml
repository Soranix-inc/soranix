apiVersion: apps/v1
kind: Deployment
metadata:
  name: money-management
  namespace: soranix
  labels:
    app: money-management
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: money-management
      tier: backend
  template:
    metadata:
      labels:
        app: money-management
        tier: backend
    spec:
      serviceAccountName: soranix-sa
      containers:
        - name: money-management
          image: soranix/money-management:latest
          ports:
            - containerPort: 5005
              name: http
          resources:
            requests:
              cpu: '200m'
              memory: '256Mi'
            limits:
              cpu: '1000m'
              memory: '1Gi'
          livenessProbe:
            httpGet:
              path: /health
              port: 5005
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 5005
            initialDelaySeconds: 5
            periodSeconds: 5
          env:
            - name: NODE_ENV
              value: 'production'
            - name: PORT
              value: '5005'





