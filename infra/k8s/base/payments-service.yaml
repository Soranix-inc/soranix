---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  namespace: soranix
  labels:
    app: payments
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payments
      tier: backend
  template:
    metadata:
      labels:
        app: payments
        tier: backend
    spec:
      serviceAccountName: soranix-sa
      containers:
        - name: payments
          image: soranix/payments:latest
          ports:
            - containerPort: 5003
              name: http
          resources:
            requests:
              cpu: '200m'
              memory: '256Mi'
            limits:
              cpu: '1000m'
              memory: '1Gi'
          livenessProbe:
            httpGet:
              path: /health
              port: 5003
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 5003
            initialDelaySeconds: 5
            periodSeconds: 5
          env:
            - name: NODE_ENV
              value: 'production'
            - name: PORT
              value: '5003'
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: soranix-secrets
                  key: stripe-secret-key
---
apiVersion: v1
kind: Service
metadata:
  name: payments-service
  namespace: soranix
  labels:
    app: payments
    tier: backend
spec:
  selector:
    app: payments
    tier: backend
  ports:
    - name: http
      port: 80
      targetPort: 5003
      protocol: TCP
  type: ClusterIP
