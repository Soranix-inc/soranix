---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bills-payment
  namespace: soranix
  labels:
    app: bills-payment
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bills-payment
      tier: backend
  template:
    metadata:
      labels:
        app: bills-payment
        tier: backend
    spec:
      serviceAccountName: soranix-sa
      containers:
        - name: bills-payment
          image: soranix/bills-payment:latest
          ports:
            - containerPort: 5007
              name: http
          resources:
            requests:
              cpu: '200m'
              memory: '256Mi'
            limits:
              cpu: '1000m'
              memory: '1Gi'
          livenessProbe:
            httpGet:
              path: /health
              port: 5007
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 5007
            initialDelaySeconds: 5
            periodSeconds: 5
          env:
            - name: NODE_ENV
              value: 'production'
            - name: PORT
              value: '5007'
---
apiVersion: v1
kind: Service
metadata:
  name: bills-payment-service
  namespace: soranix
  labels:
    app: bills-payment
    tier: backend
spec:
  selector:
    app: bills-payment
    tier: backend
  ports:
    - name: http
      port: 80
      targetPort: 5007
      protocol: TCP
  type: ClusterIP
