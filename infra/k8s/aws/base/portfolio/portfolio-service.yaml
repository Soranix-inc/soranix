---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio
  namespace: soranix
  labels:
    app: portfolio
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: portfolio
      tier: backend
  template:
    metadata:
      labels:
        app: portfolio
        tier: backend
    spec:
      serviceAccountName: soranix-sa
      containers:
        - name: portfolio
          image: soranix/portfolio:latest
          ports:
            - containerPort: 5010
              name: http
          resources:
            requests:
              cpu: '200m'
              memory: '256Mi'
            limits:
              cpu: '1000m'
              memory: '1Gi'
          livenessProbe:
            httpGet:
              path: /health
              port: 5010
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 5010
            initialDelaySeconds: 5
            periodSeconds: 5
          env:
            - name: NODE_ENV
              value: 'production'
            - name: PORT
              value: '5010'
---
apiVersion: v1
kind: Service
metadata:
  name: portfolio-service
  namespace: soranix
  labels:
    app: portfolio
    tier: backend
spec:
  selector:
    app: portfolio
    tier: backend
  ports:
    - name: http
      port: 80
      targetPort: 5010
      protocol: TCP
  type: ClusterIP
