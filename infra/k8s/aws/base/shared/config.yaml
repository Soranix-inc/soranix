---
apiVersion: v1
kind: ConfigMap
metadata:
  name: soranix-config
  namespace: soranix
data:
  # Environment configuration
  NODE_ENV: 'production'
  LOG_LEVEL: 'info'

  # Database configuration
  DB_HOST: 'postgres-service'
  DB_PORT: '5432'
  DB_NAME: 'soranix'

  # Redis configuration
  REDIS_HOST: 'redis-service'
  REDIS_PORT: '6379'

  # RabbitMQ configuration
  RABBITMQ_HOST: 'rabbitmq-service'
  RABBITMQ_PORT: '5672'
  RABBITMQ_USERNAME: 'soranix'
  RABBITMQ_VHOST: '/'

  # API configuration
  API_VERSION: 'v1'
  CORS_ORIGIN: 'https://app.soranix.com,https://web.soranix.com,https://admin.soranix.com'

  # Feature flags
  ENABLE_AI_FEATURES: 'true'
  ENABLE_PAYMENTS: 'true'
  ENABLE_BANKING: 'true'
---
