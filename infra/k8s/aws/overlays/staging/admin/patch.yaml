apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: admin
          resources:
            requests:
              cpu: '100m'
              memory: '128Mi'
            limits:
              cpu: '500m'
              memory: '512Mi'
          env:
            - name: NODE_ENV
              value: 'staging'
            - name: API_URL
              value: 'https://staging.api.soranix.com'
