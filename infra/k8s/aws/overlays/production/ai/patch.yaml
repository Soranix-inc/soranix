apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai
spec:
  replicas: 3
  template:
    spec:
      containers:
        - name: ai
          resources:
            requests:
              cpu: '1000m'
              memory: '1Gi'
            limits:
              cpu: '4000m'
              memory: '4Gi'
          env:
            - name: NODE_ENV
              value: 'production'
            - name: PORT
              value: '5001'
