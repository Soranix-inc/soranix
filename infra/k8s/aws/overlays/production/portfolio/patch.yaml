apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio
spec:
  replicas: 3
  template:
    spec:
      containers:
        - name: portfolio
          resources:
            requests:
              cpu: '500m'
              memory: '512Mi'
            limits:
              cpu: '2000m'
              memory: '2Gi'
          env:
            - name: NODE_ENV
              value: 'production'
            - name: PORT
              value: '5010'
