apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: ai
          resources:
            requests:
              cpu: '200m'
              memory: '256Mi'
            limits:
              cpu: '1000m'
              memory: '1Gi'
          env:
            - name: NODE_ENV
              value: 'development'
            - name: PORT
              value: '5001'
