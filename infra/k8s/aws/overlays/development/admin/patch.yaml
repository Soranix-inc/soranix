apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: admin
          resources:
            requests:
              cpu: '50m'
              memory: '64Mi'
            limits:
              cpu: '200m'
              memory: '256Mi'
          env:
            - name: NODE_ENV
              value: 'development'
            - name: API_URL
              value: 'http://localhost:5000'
