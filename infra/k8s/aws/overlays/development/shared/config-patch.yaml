apiVersion: v1
kind: ConfigMap
metadata:
  name: soranix-config
data:
  # Override base configuration for development
  NODE_ENV: 'development'
  LOG_LEVEL: 'debug'
  DB_HOST: 'localhost'
  DB_PORT: '5432'
  DB_NAME: 'soranix_dev'
  REDIS_HOST: 'localhost'
  REDIS_PORT: '6379'
  API_VERSION: 'v1'
  CORS_ORIGIN: 'http://localhost:3000,http://localhost:5173,http://localhost:3001'
  ENABLE_AI_FEATURES: 'true'
  ENABLE_PAYMENTS: 'true'
  ENABLE_BANKING: 'true'
