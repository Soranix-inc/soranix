apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: payments
          resources:
            requests:
              cpu: '100m'
              memory: '128Mi'
            limits:
              cpu: '500m'
              memory: '512Mi'
          env:
            - name: NODE_ENV
              value: 'development'
            - name: PORT
              value: '5003'
