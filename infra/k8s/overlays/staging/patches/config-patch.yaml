apiVersion: v1
kind: ConfigMap
metadata:
  name: soranix-config
data:
  # Override base configuration for staging
  NODE_ENV: 'staging'
  LOG_LEVEL: 'info'
  DB_HOST: 'staging-db'
  DB_PORT: '5432'
  DB_NAME: 'soranix_staging'
  REDIS_HOST: 'staging-redis'
  REDIS_PORT: '6379'
  API_VERSION: 'v1'
  CORS_ORIGIN: 'https://staging.app.soranix.com,https://staging.web.soranix.com,https://staging.admin.soranix.com'
  ENABLE_AI_FEATURES: 'true'
  ENABLE_PAYMENTS: 'true'
  ENABLE_BANKING: 'true'
