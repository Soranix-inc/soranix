apiVersion: v1
kind: ConfigMap
metadata:
  name: soranix-config
data:
  # Override base configuration for production
  NODE_ENV: 'production'
  LOG_LEVEL: 'warn'
  DB_HOST: 'prod-db'
  DB_PORT: '5432'
  DB_NAME: 'soranix_prod'
  REDIS_HOST: 'prod-redis'
  REDIS_PORT: '6379'
  API_VERSION: 'v1'
  CORS_ORIGIN: 'https://app.soranix.com,https://web.soranix.com,https://admin.soranix.com'
  ENABLE_AI_FEATURES: 'true'
  ENABLE_PAYMENTS: 'true'
  ENABLE_BANKING: 'true'
