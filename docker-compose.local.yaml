services:
  soranix-client:
    build:
      context: ./apps/client
      dockerfile: Dockerfile.dev
    ports:
      - 3000:3000
    restart: always
    depends_on:
      - soranix-auth
      - rabbitmq
      - kafka
    environment:
      - CHOKIDAR_USEPOLLING=true
      - PORT=3000
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=guest
      - RABBITMQ_PASSWORD=guest
      - KAFKA_BROKERS=kafka:9093
      - KAFKA_CLIENT_ID=soranix-client
    volumes:
      - /app/node_modules
      - ./apps/client:/app
    networks:
      - soranix

  soranix-auth:
    build:
      context: ./services/auth
      dockerfile: Dockerfile.dev
    volumes:
      - /app/node_modules
      - ./services/auth:/app
      - ./infra/keys:/app/keys:ro
    ports:
      - target: 5001
        published: 5001
        mode: 'host'
    environment:
      - PORT=6000
      - NODE_ENV=development
      - DATABASE_URL=postgresql://soranix:soranix@postgres:5432/auth_db
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=guest
      - RABBITMQ_PASSWORD=guest
      - KAFKA_BROKERS=kafka:9093
      - KAFKA_CLIENT_ID=soranix-auth
      - EVENT_ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      - JWT_PRIVATE_KEY_PATH=/app/keys/private.key
      - JWT_PUBLIC_KEY_PATH=/app/keys/public.key
      - JWT_EXPIRES_IN=7d
      - JWT_ISSUER=soranix-auth
      - JWT_AUDIENCE=soranix
      - SERVICE_NAME=soranix-auth
      - SERVICE_VERSION=1.0.0
      - JAEGER_ENDPOINT=http://jaeger:14268/api/traces
      - OTLP_ENDPOINT=http://jaeger:4318/v1/traces
      - TRACING_ENABLED=true
      - TRACING_SAMPLING_RATIO=1.0
    depends_on:
      - rabbitmq
      - kafka
      - postgres
    networks:
      - soranix

  soranix-users:
    build:
      context: ./services/users
      dockerfile: Dockerfile.dev
    volumes:
      - /app/node_modules
      - ./services/users:/app
      - ./infra/keys/public.key:/app/keys/public.key:ro
    ports:
      - target: 6001
        published: 6001
        mode: 'host'
    environment:
      - PORT=6001
      - NODE_ENV=development
      - DATABASE_URL=postgresql://soranix:soranix@postgres:5432/users_db
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=guest
      - RABBITMQ_PASSWORD=guest
      - KAFKA_BROKERS=kafka:9093
      - KAFKA_CLIENT_ID=soranix-users
      - EVENT_ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      - JWT_PUBLIC_KEY_PATH=/app/keys/public.key
      - JWT_ISSUER=soranix-auth
      - JWT_AUDIENCE=soranix
      - SERVICE_NAME=soranix-users
      - SERVICE_VERSION=1.0.0
      - JAEGER_ENDPOINT=http://jaeger:14268/api/traces
      - OTLP_ENDPOINT=http://jaeger:4318/v1/traces
      - TRACING_ENABLED=true
      - TRACING_SAMPLING_RATIO=1.0
    depends_on:
      - rabbitmq
      - kafka
      - postgres
    networks:
      - soranix

  soranix-ledger:
    build:
      context: ./services/ledger
      dockerfile: Dockerfile.dev
    volumes:
      - /app/node_modules
      - ./services/ledger:/app
    ports:
      - target: 6002
        published: 6002
        mode: 'host'
    environment:
      - PORT=6002
      - NODE_ENV=development
      - DATABASE_URL=postgresql://soranix:soranix@postgres:5432/ledger_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=soranix
      - REDIS_DB=0
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=guest
      - RABBITMQ_PASSWORD=guest
      - KAFKA_BROKERS=kafka:9093
      - KAFKA_CLIENT_ID=soranix-ledger
      - EVENT_ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      - SERVICE_NAME=soranix-ledger
      - SERVICE_VERSION=1.0.0
      - LEDGER_RETENTION_DAYS=2555
      - IDEMPOTENCY_EXPIRY_HOURS=24
      - JAEGER_ENDPOINT=http://jaeger:14268/api/traces
      - OTLP_ENDPOINT=http://jaeger:4318/v1/traces
      - TRACING_ENABLED=true
      - TRACING_SAMPLING_RATIO=1.0
    depends_on:
      - rabbitmq
      - kafka
      - postgres
      - redis
    networks:
      - soranix

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: soranix-rabbitmq
    ports:
      - '5672:5672' # AMQP port
      - '15672:15672' # Management UI port
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
      - RABBITMQ_DEFAULT_VHOST=/
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
    networks:
      - soranix
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'ping']
      interval: 30s
      timeout: 10s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: soranix-kafka
    ports:
      - '9092:9092' # External access (localhost)
      - '9093:9093' # Internal Docker network
      - '9094:9094' # Controller port
    environment:
      # KRaft mode configuration (no Zookeeper needed!)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9094'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'

      # Listeners
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:9093,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://kafka:9094'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9093,PLAINTEXT_HOST://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'

      # Cluster configuration
      CLUSTER_ID: 'soranix-kafka-kraft-cluster-001'

      # Topic settings
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'

      # Retention (7 years for compliance)
      KAFKA_LOG_RETENTION_HOURS: 61320 # 7 years (7 * 365 * 24)
      KAFKA_LOG_RETENTION_BYTES: -1 # Unlimited
      KAFKA_LOG_SEGMENT_BYTES: 1073741824 # 1GB segments

      # Performance
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_COMPRESSION_TYPE: 'snappy'

      # Metadata
      KAFKA_METADATA_LOG_SEGMENT_MS: 900000 # 15 minutes
      KAFKA_METADATA_MAX_RETENTION_MS: 604800000 # 7 days

    volumes:
      - kafka_data:/var/lib/kafka/data
      - kafka_metadata:/var/lib/kafka/metadata
    networks:
      - soranix
    command: >
      bash -c "
      # Format storage if not already formatted
      kafka-storage format -t soranix-kafka-kraft-cluster-001 -c /etc/kafka/kafka.properties 2>/dev/null || echo 'Storage already formatted'
      # Start Kafka in KRaft mode
      /etc/confluent/docker/run
      "
    healthcheck:
      test: ['CMD-SHELL', 'kafka-broker-api-versions --bootstrap-server localhost:9093 || exit 1']
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: soranix-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - '8090:8080'
    environment:
      KAFKA_CLUSTERS_0_NAME: soranix-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9093
      KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL: PLAINTEXT
      DYNAMIC_CONFIG_ENABLED: 'true'
    networks:
      - soranix

  postgres:
    image: postgres:15-alpine
    container_name: soranix-postgres
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=soranix
      - POSTGRES_PASSWORD=soranix
      - POSTGRES_DB=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    networks:
      - soranix
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U soranix']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: soranix-redis
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes --requirepass soranix
    volumes:
      - redis_data:/data
    networks:
      - soranix
    healthcheck:
      test: ['CMD', 'redis-cli', '--raw', 'incr', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  soranix-nginx:
    build:
      context: ./infra/nginx
      dockerfile: Dockerfile.dev
    ports:
      - '80:80'
      - '443:443'
    depends_on:
      - soranix-client
      - soranix-auth
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - soranix

  jaeger:
    image: jaegertracing/all-in-one:1.51
    container_name: soranix-jaeger
    ports:
      - '16686:16686' # Jaeger UI
      - '14268:14268' # Jaeger collector HTTP
      - '4317:4317' # OTLP gRPC
      - '4318:4318' # OTLP HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - soranix

networks:
  soranix:

volumes:
  rabbitmq_data:
  postgres_data:
  redis_data:
  kafka_data:
  kafka_metadata:
